[workspace]
# `crates/swarmdeck-mcp` (mcp-task-server/T6): the MCP sidecar binary. It's a
# separate crate — not `src-tauri` — because the CLI agent spawns MCP
# servers as a stdio subprocess, and the app is already running as its own
# process (see .specs/features/mcp-task-server/design.md, "Pesquisa").
members = ["src-tauri", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.40"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

# SPEC: release-distribution (REL-35)
# Perfil enxuto para o binário distribuído: remove símbolos de debug e liga
# LTO/codegen-units=1 para o linker enxugar código morto entre crates.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
