# SPEC: release-distribution (REL-27, REL-28, REL-29, REL-30, REL-31, REL-36)
#
# Validação de push em master e de pull requests. Este arquivo nunca cria
# tag, release ou artefato — publicar é responsabilidade exclusiva de
# `release.yml`, disparado manualmente.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run test:scripts

  rust:
    name: rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf \
            wget \
            curl

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --all -- --check
      - run: cargo test

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf \
            wget \
            curl

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo clippy --all-targets -- -D warnings

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits on the PR range
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          failed=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            parents=$(git rev-list --parents -n 1 "$sha" | wc -w)
            if [ "$parents" -gt 2 ]; then
              # commit de merge (mais de um pai) — ignorado
              continue
            fi
            subject=$(git log -1 --format=%s "$sha")
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "::error::commit $sha não segue Conventional Commits: $subject"
              failed=1
            fi
          done < <(git rev-list "origin/${{ github.base_ref }}..HEAD")
          exit $failed
