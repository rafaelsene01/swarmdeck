[package]
name = "swarmdeck"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orquestrador desktop de múltiplos agentes de IA em terminal"

[lib]
name = "swarmdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"
# SPEC: mcp-task-server (MCP-01)
# Transporte do `IpcServer` (src/ipc/): named pipe no Windows, socket de
# domínio Unix nos demais, via `local_socket` — ver src/ipc/transport.rs
# para a decisão de usar essa fachada em vez dos módulos os::windows/os::unix
# crus.
interprocess = "2.4.3"

# SPEC: release-distribution (REL-19, REL-21, REL-24)
# Verificação de atualização (src/update/check.rs): fala com o endpoint
# configurado em `tauri.conf.json` via `UpdaterExt`. `semver` decide se a
# versão publicada é mais nova que a instalada. Versões reconfirmadas no
# crates.io em 01/08/2026 (T15): tauri-plugin-updater 2.10.1 (exige
# `tauri ^2.10`, satisfeito por `tauri = "2"` acima), semver 1.0.28.
tauri-plugin-updater = "2.10.1"
semver = "1"

# SPEC: release-distribution (REL-22, REL-24, REL-25)
# Verificação da assinatura minisign do zip portátil (src/update/portable.rs)
# com a mesma chave pública usada pelo tauri-plugin-updater — um único
# esquema de confiança (Ed25519/minisign) para os dois caminhos de update.
# Versão reconfirmada no crates.io em 01/08/2026 (T16): minisign-verify 0.2.5.
minisign-verify = "0.2.5"

# SPEC: multi-terminal (TERM-10, TERM-11)
# Seletor nativo de pasta usado pelo `NewTerminalDialog` (T15) para escolher
# o diretório de trabalho do terminal. Versão confirmada no crates.io em
# 03/08/2026 (T14): tauri-plugin-dialog 2.7.2 (exige `tauri ^2.10`,
# satisfeito por `tauri = "2"` acima, mesma faixa que tauri-plugin-updater
# já usa).
tauri-plugin-dialog = "2.7.2"

# SPEC: release-distribution (REL-37, REL-38)
# Timer do checador em segundo plano (src/update/apply.rs): `tokio::spawn`
# roda dentro do runtime que o próprio Tauri já mantém, `tokio::time::sleep`
# espaça os ciclos de 1h. Antes só dev-dependency (usado pelos testes de
# src/update/check.rs via #[tokio::test]); agora dependency de produção com
# as mesmas features mais "time".
tokio = { version = "1", features = ["macros", "rt", "time"] }

# SPEC: quota-indicator (QUOTA-13)
# Cliente HTTP da busca de cota (src/quota.rs), AD-003: reqwest 0.13.4 já
# está no Cargo.lock como dependência transitiva de tauri-plugin-updater,
# então promovê-la a direta não adiciona crate nem tempo de compilação.
# `rustls-no-provider` (não `rustls`, que puxaria aws-lc-rs — crate nova,
# ausente do lock) usa o `ring`, provedor de cripto que já está no lock via
# tauri-plugin-updater. Quem **instala** esse provedor como padrão do
# processo é `lib.rs::run` — nenhuma dependência faz isso sozinha, e sem a
# instalação `Client::builder().build()` PANICA ("No rustls crypto provider
# is configured"), derrubando a task do comando sem nunca resolver a promise
# do IPC. Ver `rustls` abaixo.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

# Só pelo `install_default()` do provedor `ring` chamado em `lib.rs::run`.
# rustls 0.23 e ring 0.17 já estavam no Cargo.lock (via tauri-plugin-updater),
# então promovê-los a diretos não adiciona crate nem tempo de compilação.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# SPEC: quota-indicator (QUOTA-25)
# Validação de `resets_at` em src/quota.rs (edge case QUOTA-25: data
# inválida vira "sem tempo até o reset", não erro). chrono 0.4.45 já está
# no Cargo.lock, puxado transitivamente por schemars; `default-features = false`
# porque só o parser RFC 3339 é usado, sem `Local`/`clock`.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# SPEC: quota-indicator (QUOTA-16, QUOTA-18)
# Resolução de `~/.claude/.credentials.json` em src/quota.rs. dirs 6.0.0 já
# está no Cargo.lock, puxado transitivamente por tauri-plugin-updater.
dirs = "6"

[dev-dependencies]
tempfile = "3"
